<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelPay — Secure Rent Checkout</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white font-bold text-xl shadow-md shadow-indigo-100 mb-3">
                HP
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">HostelPay</h1>
            <p class="text-sm text-slate-500 mt-1">Automated zero-friction rent payment portal</p>
        </div>

        <form action="/checkout/initialize" method="POST" class="space-y-5">
            
            <div>
                <label for="student_identifier" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
                    Email or Platform Username
                </label>
                <input type="text" id="student_identifier" name="student_identifier" required
                    placeholder="e.g., student@domain.com or dev_theo"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="block" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
                        Building Block
                    </label>
                    <select id="block" name="block" required
                        class="w-full px-3 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
                        <option value="" disabled selected>Select Block</option>
                        <option value="white house">White House</option>
                        <option value="green house">Green House</option>
                        <option value="blue house">Blue House</option>
                    </select>
                </div>

                <div>
                    <label for="floor_level" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
                        Floor Level
                    </label>
                    <select id="floor_level" name="floor_level" required
                        class="w-full px-3 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
                        <option value="" disabled selected>Select Floor</option>
                        <option value="Ground Floor">Ground Floor</option>
                        <option value="Middle floor">Middle Floor</option>
                        <option value="Top floor">Top Floor</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="room_number" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
                        Room Number
                    </label>
                    <input type="text" id="room_number" name="room_number" required
                        placeholder="e.g., 104"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
                </div>

                <div>
                    <label for="occupancy_type" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
                        Occupancy Plan
                    </label>
                    <select id="occupancy_type" name="occupancy_type" required
                        class="w-full px-3 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
                        <option value="" disabled selected>Select Plan</option>
                        <option value="single">Single (100% Rate)</option>
                        <option value="shared">Shared (50% Rate)</option>
                    </select>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/10 hover:shadow-indigo-600/20 active:scale-[0.98] transition-all text-sm mt-2 cursor-pointer">
                Proceed to Secure Checkout
            </button>

        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Secured and processed natively via Nomba Checkout API.
        </p>

    </div>

</body>
</html>
